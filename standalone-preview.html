    // ==========================================
    // 3. COMPONENTE PRINCIPAL APP
    // ==========================================
    function App() {
      const [deals, setDeals] = useState(initialDeals);
      const [stages] = useState(initialStages);
      const [customers] = useState(initialCustomers);
      const [users] = useState(initialUsers);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [dateRange] = useState('1 June - 30 June 2026');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [bannerVisible, setBannerVisible] = useState(true);

      // Mapas auxiliares
      const customerMap = useMemo(() => Object.fromEntries(customers.map(c => [c.id, c])), [customers]);
      const userMap = useMemo(() => Object.fromEntries(users.map(u => [u.id, u])), [users]);
      const stageMap = useMemo(() => Object.fromEntries(stages.map(s => [s.id, s])), [stages]);

      // ------------------------------------------
      // CÁLCULOS ESTRICTAMENTE DINÁMICOS DE KPIS
      // ------------------------------------------
      const wonDeals = useMemo(() => deals.filter(d => d.status === 'won'), [deals]);
      const lostDeals = useMemo(() => deals.filter(d => d.status === 'lost'), [deals]);
      const openDeals = useMemo(() => deals.filter(d => d.status === 'open'), [deals]);

      // KPI 1: Total Revenue = Suma de amount donde status = 'won'
      const totalRevenue = useMemo(() => wonDeals.reduce((sum, d) => sum + (Number(d.amount) || 0), 0), [wonDeals]);

      // KPI 2: Active Deals = Conteo donde status = 'open'
      const activeDealsCount = openDeals.length;
      const activePipelineValue = useMemo(() => openDeals.reduce((sum, d) => sum + (Number(d.amount) || 0), 0), [openDeals]);

      // KPI 3: Win Rate = % deals ganados sobre cerrados
      const closedCount = wonDeals.length + lostDeals.length;
      const winRate = closedCount > 0 ? ((wonDeals.length / closedCount) * 100).toFixed(1) : '0.0';

      // KPI 4: Avg Deal Size = Promedio de valor de venta
      const avgDealSize = wonDeals.length > 0 ? Math.round(totalRevenue / wonDeals.length) : 0;

      // Actualizar estado de un trato directamente en vivo
      const handleUpdateDealStatus = (dealId, newStatus) => {
        setDeals(prev => prev.map(deal => {
          if (deal.id !== dealId) return deal;
          let newStageId = deal.stage_id;

            newStageId = 's3'; // Negotiation
            closedAt = undefined;
          }

          return { ...deal, status: newStatus, stage_id: newStageId, closed_at: closedAt };
        }));

                      <span className="flex items-center space-x-1.5">
                        <span className="w-2.5 h-2.5 rounded-full border border-dashed border-neutral-400 bg-neutral-100"></span>
                        <span>Cuota Asignada</span>
                      </span>
                    </div>
                    <span className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">
                      +18.4% Velocidad
                    </span>
                  </div>
                </div>
              </div>

              {/* 3. LEADERBOARD DE VENDEDORES & COMPOSICIÓN POR INDUSTRIA (Estilo idéntico a referencia) */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* Reps Leaderboard */}
                <div className="bg-white rounded-2xl p-6 border border-[#ecebe6] shadow-2xs flex flex-col justify-between">
                  <div className="flex items-center justify-between pb-3 border-b border-neutral-100">
                    <div>
                      <h3 className="text-sm font-bold text-neutral-900 tracking-tight">
                        Sales Rep Performance Leaderboard
                      </h3>
                      <p className="text-[11px] text-neutral-400 mt-0.5">
                        Rendimiento clasificado por ingresos y cuota individual
                      </p>
                    </div>
                    <button className="flex items-center space-x-1 text-xs font-semibold text-neutral-600 hover:text-neutral-900">
                      <span>View full team</span>
                      <Icons.ChevronRight />
                    </button>
                  </div>

                  <div className="mt-3 overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="text-neutral-400 text-[10px] uppercase font-bold tracking-wider border-b border-neutral-100">
                          <th className="pb-2.5 font-bold w-6">#</th>
                          <th className="pb-2.5 font-bold">Vendedor</th>
                          <th className="pb-2.5 font-bold text-right">Revenue Won</th>
                          <th className="pb-2.5 font-bold text-center">Cuota %</th>
                          <th className="pb-2.5 font-bold text-right">Win Rate</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-neutral-100">
                        {users.map((user, idx) => {
                          const uDeals = deals.filter(d => d.owner_id === user.id);
                          const uWon = uDeals.filter(d => d.status === 'won');
                          const uLost = uDeals.filter(d => d.status === 'lost');
                          const rev = uWon.reduce((s, d) => s + (Number(d.amount) || 0), 0);
                          const att = Math.round((rev / (user.quota_amount || 80000)) * 100);
                          const wr = (uWon.length + uLost.length) > 0 ? Math.round((uWon.length / (uWon.length + uLost.length)) * 100) : 0;

                          return { ...user, rev, att, wr };
                        })
                        .sort((a,b) => b.rev - a.rev)
                        .map((rep, idx) => (
                          <tr key={rep.id} className="hover:bg-neutral-50/70 transition-colors">
                            <td className="py-2.5 text-neutral-400 font-bold text-xs">
                              {idx === 0 ? (
                                <span className="w-5 h-5 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-[10px]">1</span>
                              ) : `#${idx + 1}`}
                            </td>
                            <td className="py-2.5">
                              <div className="flex items-center space-x-2.5">
                                <img src={rep.avatar_url} alt="" className="w-7 h-7 rounded-full object-cover ring-1 ring-neutral-200" />
                                <div>
                                  <span className="font-semibold text-neutral-900 block">{rep.full_name}</span>
                                  <span className="text-[10px] text-neutral-400">{rep.role === 'manager' ? 'Sales Manager' : 'Sales Rep'}</span>
                                </div>
                              </div>
                            </td>
                            <td className="py-2.5 text-right font-bold text-neutral-800">
                              €{rep.rev.toLocaleString()}
                            </td>
                            <td className="py-2.5 text-center">
                              <div className="inline-flex items-center space-x-1.5 bg-neutral-100 px-2 py-0.5 rounded-full">
                                <span className={`w-1.5 h-1.5 rounded-full ${rep.att >= 100 ? 'bg-emerald-500' : rep.att >= 80 ? 'bg-blue-500' : 'bg-amber-500'}`}></span>
                                <span className="text-[11px] font-semibold text-neutral-700">{rep.att}%</span>
                              </div>
                            </td>
                            <td className="py-2.5 text-right font-semibold text-neutral-600">
                              {rep.wr}%
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Industry Breakdown (Composition) */}
                <div className="bg-white rounded-2xl p-6 border border-[#ecebe6] shadow-2xs flex flex-col justify-between">
                  <div className="flex items-center justify-between pb-3 border-b border-neutral-100">
                    <div>
                      <h3 className="text-sm font-bold text-neutral-900 tracking-tight">
                        Pipeline Composition by Industry
                      </h3>
                      <p className="text-[11px] text-neutral-400 mt-0.5">
                        Volumen total de ventas distribuido por sector B2B
                      </p>
                    </div>
                    <button className="flex items-center space-x-1 text-xs font-semibold text-neutral-600 hover:text-neutral-900">
                      <span>View all</span>
                      <Icons.ChevronRight />
                    </button>
                  </div>

                  {(() => {
                    const indTotals = {};
                    let grandTotal = 0;
                    deals.forEach(d => {
                      const c = customerMap[d.customer_id];
                      const ind = c ? c.industry : "Otros";
                      const amt = Number(d.amount) || 0;
                      indTotals[ind] = (indTotals[ind] || 0) + amt;
                      grandTotal += amt;
                    });
                    const colors = ["#818cf8", "#38bdf8", "#34d399", "#fbbf24", "#f472b6", "#a78bfa"];
                    const list = Object.entries(indTotals)
                      .map(([industry, amount], i) => ({
                        industry,
                        amount,
                        pct: grandTotal > 0 ? Math.round((amount / grandTotal) * 100) : 0,
                        color: colors[i % colors.length]
                      }))
                      .sort((a,b) => b.amount - a.amount);

                    return (
                      <div className="space-y-3.5 my-3">
                        {list.slice(0, 5).map(item => (
                          <div key={item.industry} className="flex items-center justify-between space-x-4">
                            <div className="flex items-center space-x-2 w-40 truncate">
                              <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: item.color }}></span>
                              <span className="text-xs font-medium text-neutral-700 truncate">{item.industry}</span>
                            </div>
                            <div className="flex-1 h-2.5 bg-neutral-100 rounded-full overflow-hidden flex items-center">
                              <div className="h-full rounded-full transition-all duration-500" style={{ width: `${Math.max(item.pct, 4)}%`, backgroundColor: item.color }}></div>
                            </div>
                            <div className="w-12 text-right">
                              <span className="text-xs font-bold text-neutral-800">{item.pct}%</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}

                  <div className="pt-3 border-t border-neutral-100 flex items-center justify-between bg-neutral-50/80 -mx-2 px-3 py-2 rounded-xl">
                    <div className="flex items-center space-x-2">
                      <div className="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold">✓</div>
                      <div className="leading-tight">
                        <p className="text-xs font-semibold text-neutral-900">Último trato ganado</p>
                        <p className="text-[10px] text-neutral-500">TechSolutions SL · €32.000 Closed Won</p>
                      </div>
                    </div>
                    <span className="text-[10px] text-neutral-400 font-medium">hace 2h</span>
                  </div>
                </div>
              </div>

              {/* 4. TABLA INTERACTIVA DE TOP DEALS (Cambio de estado en vivo para recalcular KPIs) */}
              <div className="bg-white rounded-2xl p-6 border border-[#ecebe6] shadow-2xs">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-4 border-b border-neutral-100">
                  <div>
                    <h3 className="text-sm font-bold text-neutral-900 tracking-tight">
                      Top Deals Recientes (Control Dinámico en Vivo)
                    </h3>
                    <p className="text-[11px] text-neutral-400 mt-0.5">
                      Cambia el estado de cualquier trato directamente en el menú para ver cómo todos los KPIs y gráficos se recalculan en tiempo real
                    </p>
                  </div>
                  <div className="text-xs font-semibold text-neutral-500 bg-neutral-100 px-3 py-1 rounded-lg">
                    Total: {deals.length} oportunidades registradas
                  </div>
                </div>

                <div className="mt-4 overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="text-neutral-400 text-[10px] uppercase font-bold tracking-wider border-b border-neutral-100">
                        <th className="pb-3 font-bold">Oportunidad</th>
                        <th className="pb-3 font-bold">Cliente B2B</th>
                        <th className="pb-3 font-bold">Vendedor</th>
                        <th className="pb-3 font-bold">Etapa</th>
                        <th className="pb-3 font-bold text-right">Monto (€)</th>
                        <th className="pb-3 font-bold text-center">Estado (Editable en Vivo)</th>
                        <th className="pb-3 font-bold text-right">Cierre / Previsión</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-neutral-100">
                      {deals.slice(0, 8).map(deal => {
                        const cust = customerMap[deal.customer_id];
                        const owner = userMap[deal.owner_id];
                        const stage = stageMap[deal.stage_id];

                        return (
                          <tr key={deal.id} className="hover:bg-neutral-50/70 transition-colors">
                            <td className="py-3 pr-3">
                              <p className="font-semibold text-neutral-900">{deal.title}</p>
                              <p className="text-[10px] text-neutral-400 font-mono">{deal.id}</p>
                            </td>
                            <td className="py-3 pr-3">
                              <span className="font-medium text-neutral-800 block">{cust?.company_name}</span>
                              <span className="text-[10px] text-neutral-400">{cust?.industry}</span>
                            </td>
                            <td className="py-3 pr-3">
                              <div className="flex items-center space-x-2">
                                <img src={owner?.avatar_url} alt="" className="w-6 h-6 rounded-full object-cover ring-1 ring-neutral-200" />
                                <span className="text-neutral-700 font-medium truncate max-w-[100px]">{owner?.full_name}</span>
                              </div>
                            </td>
                            <td className="py-3 pr-3">
                              <span className="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-white shadow-2xs" style={{ backgroundColor: stage?.color || '#94a3b8' }}>
                                {stage?.name}
                              </span>
                            </td>
                            <td className="py-3 pr-3 text-right font-bold text-neutral-900">
                              €{Number(deal.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}
                            </td>
                            <td className="py-3 px-2 text-center">
                              <select
                                value={deal.status}
                                onChange={(e) => handleUpdateDealStatus(deal.id, e.target.value)}
                                className={`text-xs font-semibold rounded-lg px-2.5 py-1 border transition-all cursor-pointer shadow-2xs focus:outline-none ${
                                  deal.status === 'won'
                                    ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                                    : deal.status === 'lost'
                                    ? 'bg-rose-50 text-rose-800 border-rose-300'
                                    : 'bg-orange-50 text-orange-800 border-orange-300'
                                }`}
                              >
                                <option value="won">✓ Won (Ganado)</option>
                                <option value="open">⏳ Open (Abierto)</option>
                                <option value="lost">✕ Lost (Perdido)</option>
                              </select>
                            </td>
                            <td className="py-3 text-right text-[11px] text-neutral-500 font-medium">
                              {deal.closed_at ? new Date(deal.closed_at).toLocaleDateString() : deal.expected_close_date || 'En curso'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          </div>

          {/* MODAL NUEVA OPORTUNIDAD */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-neutral-200">
                <div className="flex items-center justify-between pb-3 border-b border-neutral-100">
                  <h3 className="text-sm font-bold text-neutral-900">Crear Nueva Oportunidad</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-neutral-400 hover:text-neutral-700">
                    <Icons.X />
                  </button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const titleVal = form.title.value;
                    const amtVal = parseFloat(form.amount.value) || 20000;
                    const stVal = form.status.value;
                    const custVal = form.customer.value;
                    const ownerVal = form.owner.value;

                    handleAddDeal({
                      id: `d${Date.now()}`,
                      title: titleVal,
                      customer_id: custVal,
                      owner_id: ownerVal,
                      stage_id: stVal === 'won' ? 's4' : stVal === 'lost' ? 's5' : 's3',
                      amount: amtVal,
                      currency: 'EUR',
                      status: stVal,
                      created_at: new Date().toISOString(),
                      closed_at: stVal === 'won' ? new Date().toISOString() : undefined,
                      expected_close_date: '2024-06-30'
                    });
                    setIsModalOpen(false);
                  }}
                  className="mt-4 space-y-3.5 text-xs"
                >
                  <div>
                    <label className="block font-semibold text-neutral-700 mb-1">Título del Trato</label>
                    <input name="title" required placeholder="ej: Licencia Global Cloud" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-lg" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-neutral-700 mb-1">Cliente</label>
                      <select name="customer" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-lg">
                        {customers.map(c => <option key={c.id} value={c.id}>{c.company_name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-neutral-700 mb-1">Vendedor</label>
                      <select name="owner" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-lg">
                        {users.map(u => <option key={u.id} value={u.id}>{u.full_name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-neutral-700 mb-1">Monto (€)</label>
                      <input name="amount" type="number" required defaultValue="35000" step="1000" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block font-semibold text-neutral-700 mb-1">Estado</label>
                      <select name="status" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-lg">
                        <option value="won">Ganado (Won)</option>
                        <option value="open">Abierto (Open)</option>
                        <option value="lost">Perdido (Lost)</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-3 border-t border-neutral-100 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-3.5 py-1.5 text-neutral-600">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-[#ea580c] text-white rounded-lg font-semibold">Guardar y Calcular</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
